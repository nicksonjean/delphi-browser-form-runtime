[TestRunner]
; Configurações do DUnitX Test Runner
UseRTTI=true
FailsOnNoAsserts=false
ExitBehavior=Pause
ReportMemoryLeaksOnShutdown=true

[Loggers]
; Configuração dos loggers de saída
ConsoleLogger=true
XMLLogger=true
TextLogger=true

[Files]
; Arquivos de saída dos testes
XMLOutputFile=TestResults.xml
TextOutputFile=TestResults.txt
HTMLOutputFile=TestResults.html

[Categories]
; Categorias de teste disponíveis
Constructor=Testes de construção e inicialização
Properties=Testes de propriedades e getters/setters
FluentInterface=Testes da interface fluente (method chaining)
Configuration=Testes de configuração de janela
Cookies=Testes de manipulação de cookies
MDI=Testes específicos para MDI (Multiple Document Interface)
Validation=Testes de validação de dados
State=Testes de estado interno do objeto
Factory=Testes dos métodos factory (NewBrowser, NewPopup, etc)
Messages=Testes de sistema de mensagens
Content=Testes de conteúdo HTML
ShowMethods=Testes dos métodos Show/ShowModal
Interface=Testes da interface IBrowserForm
EdgeCases=Testes de casos extremos
Relationships=Testes de relacionamentos Parent/Child
Events=Testes de eventos

[Environment]
; Configurações do ambiente de teste
AllowWebView2Exceptions=true
MockBrowserCreation=true
TimeoutSeconds=30